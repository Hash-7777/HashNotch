<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="Three states. At rest the island is exactly the notch. When something is playing a slim strip appears beside the notch. Hovering the notch drops the full panel below the menu bar.">
  <title>Three states of HashNotch</title>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
    .num   { fill:#3D4353; font-size:38px; font-weight:700; }
    .head  { fill:#F2F5FA; font-size:13px; font-weight:650; }
    .sub   { fill:#78829A; font-size:10.5px; }
    .ui    { fill:#E8EBF2; font-size:8px; font-weight:600; }
    .uidim { fill:#79839A; font-size:7.5px; font-weight:500; }
    .amber { fill:#E5A34B; }
    .green { fill:#47D67A; }
    .bar-t { fill:#8FBAFF; }

    /* transform-box is what makes transform-origin mean the element's own box.
       Without it SVG resolves the origin against the whole canvas, which threw
       every animated part clean across the picture. */
    .anim { transform-box: fill-box; }

    /* Each card lifts in turn, walking the eye left to right. */
    .card { opacity:.45; transform-box: fill-box; transform-origin: 50% 100%;
            animation: lift 7.5s cubic-bezier(.4,0,.2,1) infinite; }
    .c2 { animation-delay: 2.5s; }
    .c3 { animation-delay: 5s; }
    @keyframes lift {
      0%,4%    { opacity:.45; transform: translateY(0); }
      10%,28%  { opacity:1;   transform: translateY(-4px); }
      34%,100% { opacity:.45; transform: translateY(0); }
    }

    .bar { transform-box: fill-box; transform-origin: 50% 100%;
           animation: dance 1s ease-in-out infinite; }
    .d1 { animation-delay:.0s } .d2 { animation-delay:.13s }
    .d3 { animation-delay:.26s } .d4 { animation-delay:.39s }
    @keyframes dance { 0%,100% { transform: scaleY(.3) } 50% { transform: scaleY(1) } }

    .fill { transform-box: fill-box; transform-origin: 0% 50%;
            animation: grow 7.5s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes grow { 0%,5% { transform: scaleX(.05) } 30%,100% { transform: scaleX(.66) } }

    @media (prefers-reduced-motion: reduce) {
      .card, .bar, .fill { animation: none; opacity: 1; }
      .fill { transform: scaleX(.66); }
    }
  </style>

  <rect width="780" height="250" rx="16" fill="#0B0C10"/>

  <!-- ══════════ 1 · at rest ══════════ -->
  <g class="card">
    <rect x="24" y="24" width="228" height="202" rx="13" fill="#101219" stroke="#1E2230"/>
    <text class="num"  x="44" y="64">1</text>
    <text class="head" x="76" y="53">At rest</text>
    <text class="sub"  x="76" y="68">it is exactly the notch</text>

    <!-- lid -->
    <rect x="44" y="88" width="188" height="104" rx="9" fill="#191C25"/>
    <rect x="49" y="93" width="178" height="94"  rx="6" fill="#0C0F18"/>
    <!-- the notch: square top, rounded bottom, like the real shape -->
    <path d="M110 93 h56 v13 a6 6 0 0 1-6 6 h-44 a6 6 0 0 1-6-6 z" fill="#000"/>

    <text class="sub" x="138" y="212" text-anchor="middle" font-size="9.5">nothing to see until</text>
    <text class="sub" x="138" y="224" text-anchor="middle" font-size="9.5">there is something to say</text>
  </g>

  <!-- ══════════ 2 · live strip ══════════ -->
  <g class="card c2">
    <rect x="276" y="24" width="228" height="202" rx="13" fill="#101219" stroke="#1E2230"/>
    <text class="num"  x="296" y="64">2</text>
    <text class="head" x="328" y="53">Something live</text>
    <text class="sub"  x="328" y="68">a strip — no hover needed</text>

    <rect x="296" y="88" width="188" height="104" rx="9" fill="#191C25"/>
    <rect x="301" y="93" width="178" height="94"  rx="6" fill="#0C0F18"/>
    <!-- strip: wider than the notch, flanking it -->
    <path d="M318 93 h144 v13 a6 6 0 0 1-6 6 H324 a6 6 0 0 1-6-6 z" fill="#000"/>
    <rect class="amber" x="323" y="96" width="9" height="9" rx="2.5"/>
    <text class="ui" x="337" y="103">HashNotch</text>
    <g class="amber">
      <rect class="bar d1" x="440" y="97" width="2" height="8" rx="1"/>
      <rect class="bar d2" x="444" y="97" width="2" height="8" rx="1"/>
      <rect class="bar d3" x="448" y="97" width="2" height="8" rx="1"/>
      <rect class="bar d4" x="452" y="97" width="2" height="8" rx="1"/>
    </g>

    <text class="sub" x="390" y="212" text-anchor="middle" font-size="9.5">one thing at a time —</text>
    <text class="sub" x="390" y="224" text-anchor="middle" font-size="9.5">the most urgent wins</text>
  </g>

  <!-- ══════════ 3 · the panel ══════════ -->
  <g class="card c3">
    <rect x="528" y="24" width="228" height="202" rx="13" fill="#101219" stroke="#1E2230"/>
    <text class="num"  x="548" y="64">3</text>
    <text class="head" x="580" y="53">Hover the notch</text>
    <text class="sub"  x="580" y="68">everything, below the menu bar</text>

    <rect x="548" y="88" width="188" height="104" rx="9" fill="#191C25"/>
    <rect x="553" y="93" width="178" height="94"  rx="6" fill="#0C0F18"/>
    <path d="M614 93 h56 v13 a6 6 0 0 1-6 6 h-44 a6 6 0 0 1-6-6 z" fill="#000"/>
    <!-- the dropped panel, square top and rounded bottom like the app draws it -->
    <path d="M592 93 h100 v76 a11 11 0 0 1-11 11 H603 a11 11 0 0 1-11-11 z"
          fill="#0C0E15" stroke="#2A2F3C" stroke-width="1"/>
    <rect class="amber" x="600" y="112" width="15" height="15" rx="3.5"/>
    <text class="ui"    x="620" y="119">HashNotch</text>
    <text class="uidim" x="620" y="128">your notch</text>
    <rect x="600" y="135" width="84" height="2.5" rx="1.25" fill="#242936"/>
    <rect class="fill amber" x="600" y="135" width="84" height="2.5" rx="1.25"/>
    <text class="uidim" x="600" y="151">Internet</text>
    <text class="green" x="684" y="151" text-anchor="end" font-size="7.5" font-weight="600">4.2 MB/s</text>
    <text class="uidim" x="600" y="164">Storage</text>
    <text class="ui"    x="684" y="164" text-anchor="end">74% full</text>

    <text class="sub" x="642" y="212" text-anchor="middle" font-size="9.5">never covers your menus</text>
    <text class="sub" x="642" y="224" text-anchor="middle" font-size="9.5">or your status icons</text>
  </g>
</svg>
